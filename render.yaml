# Blueprint Render : https://render.com/docs/blueprint-spec
# Deploiement : render.com -> New -> Blueprint -> selectionne ce repo
services:
  - type: web
    name: campus-back
    runtime: docker
    dockerfilePath: ./back/Dockerfile
    dockerContext: ./back
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Adresse interne de RustFS dans le reseau prive Render (same region)
      - key: RUSTFS_ENDPOINT
        value: http://rustfs-server.internal:10000
      - key: RUSTFS_REGION
        value: us-east-1
      - key: RUSTFS_ACCESS_KEY
        sync: false
      - key: RUSTFS_SECRET_KEY
        generateValue: true
      - key: RUSTFS_BUCKET
        value: campus-marketplace
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: rustfs-server
    runtime: image
    image:
      url: docker.io/rustfs/rustfs:latest
    plan: free
    envVars:
      - key: RUSTFS_ACCESS_KEY
        sync: false
      - key: RUSTFS_SECRET_KEY
        sync: false
      # Render attend une ecoute sur le port 10000
      - key: RUSTFS_ADDRESS
        value: ":10000"
      - key: RUSTFS_CONSOLE_ENABLE
        value: "false"
